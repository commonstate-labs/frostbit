syntax = "proto3";
                                                              
package pb;

option go_package = "dex/pb;pb";

                                                               

               
enum TokenType {
  TOKEN_NATIVE = 0;                                   
  TOKEN_BRIDGED = 1;                                              
  TOKEN_SYSTEM = 2;                                              
}

message Token {
  string address = 1;                                                                                              
	reserved 2, 3;                                              
	reserved "symbol", "name";
  string owner = 4;                                                 
  string totalSupply = 5;                                     
  bool can_mint = 6;                           
	reserved 7;                                                                            
	reserved "decimals";
  bool can_freeze = 8;                                  
  bool can_burn = 9;                                                   
  TokenType type = 10;                                  
  uint64 create_height = 11;                
	reserved 12, 13;                                                 
	reserved "description", "icon_url";
                           
  string native_chain = 20;                            
	reserved 21;                                                           
	reserved "sign_algo";
  string native_contract = 22;                                                    
	reserved 23, 24, 25, 26;                                                               
	reserved "native_symbol", "native_decimals", "vault_id", "vault_pubkey";
}

message TokenRegistry {
  reserved 1;                                                                         
  uint64 token_count = 2;                                           
}

                                                
                                
message TokenRecord { Token token = 1; }

                                                                                

                                                      
  
                        
                                                                                 
                                                                                
                                                                       
                                                                                        
                                                        
  
                                                                        
                                                                                                         
                                                           
                                                                                       
                                                                                        
                                                                                                
enum SignAlgo {
  SIGN_ALGO_UNSPECIFIED = 0;
  SIGN_ALGO_ECDSA_SECP256K1_DEX = 1;                                           
  SIGN_ALGO_BLS_BN256_G2 = 2;                                        
  SIGN_ALGO_SCHNORR_SECP256K1_BIP340 = 3;                                             
  SIGN_ALGO_SCHNORR_ALT_BN128 =
      4;                                                                        
  SIGN_ALGO_ECDSA_SECP256K1 =
      6;                                                              
}

                                                            
message PublicKeys {
                                                                                          
  map<int32, bytes> keys = 1;
}

                                                                 
message BaseMessage {
  string tx_id = 1;                                
  string from_address = 2;                      
  uint64 executed_height = 3;                               
  PublicKeys public_keys = 4;                                        
  bytes signature = 5;                 
  string fee = 6;
  Status status = 7;
  uint64 nonce = 8;
  string status_text = 9;                                                 
  uint64 chain_id = 10;                                                                                                                 
  uint64 target_height = 11;                                                                                    
  string only_proposer = 12;                                                                                           
}

message Receipt {
  string tx_id = 1;
  string status = 2;                        
  string error = 3;
  uint64 block_height = 4;
  int64 timestamp = 5;
  uint64 gas_used = 6;
  string fee = 7;
  repeated string logs = 8;
}

message GetReceiptResponse {
  Receipt receipt = 1;
  string error = 2;
}

                                                                    
message Account {
  string address = 1;                        
  PublicKeys public_keys = 2;                                        
  uint64 nonce = 3;                                   
  reserved 4;                                                                           
  reserved 5;                                                                        
                            
  string unclaimed_reward = 8;                                  
  string last_acc_reward = 9;                                   
  bool is_miner = 10;                                           
  string ip = 11;
  uint64 index = 12;                                                                            
  string code = 13;                                      
  reserved 14;
  reserved "stake_owner";
                                                                                                  
                                                                                             
  string reward_address = 15;
}

                                                  
message AccountOrders { repeated string orders = 1; }

                                                       
                                    
message TokenBalanceRecord {
  string address = 1;                      
  string token = 2;                        
  TokenBalance balance = 3;                
}

message TokenBalance {
  string balance = 1;                                
  string miner_locked_balance = 3;                               
  string liquid_locked_balance = 4;                                 
  string witness_locked_balance = 5;                                
  string leverage_locked_balance = 6;                            
  string order_frozen_balance = 7;                         
}

                                                      
message BlockHeader {
  uint64 height = 1;                                   
  string prev_block_hash = 2;                             
  int64 timestamp = 3;                                   
  bytes state_root = 4;                                          
  string txs_hash = 5;                                                   
  string miner = 6;                                       
  int32 window = 7;                                    
  bytes vrf_proof = 8;                               
  bytes vrf_output = 9;                              
  bytes public_key = 10;                                                        
  repeated uint32 offline_reports = 11;                                                    
  repeated uint32 sampled_reports = 12;                                                       
                                                                                                         
  repeated uint32 online_reports = 13;                                                       
}

message Block {
  string block_hash = 1;                                            
  BlockHeader header = 2;                                   
  repeated AnyTx body = 3;                                
  string accumulated_reward = 4;                            
  bytes bit_map = 5;                                  
  bytes miner_signature = 6;                    
  bytes short_txs = 7;                                   
}
                           
message BlockReward {
  uint64 height = 1;
  string miner = 2;
  string miner_reward = 3;
  string other_miners_reward = 4;
  string total_fees = 5;
  string block_reward = 6;                      
  int64 timestamp = 7;
}
message OrderPriceIndex {                                                                 
  bool ok =
      1;                                                                                                                                                                                            
}

               
message TradeRecord {
  string trade_id = 1;                  
  string pair = 2;                       
  string price = 3;                         
  string amount = 4;                        
  string maker_order_id = 5;                 
  string taker_order_id = 6;                 
  OrderSide taker_side = 7;                                              
  string timestamp = 8;                     
  uint64 height = 9;                              
}

                                                                 
message IssueTokenTx {            
  BaseMessage base = 1;
	reserved 2, 3;                                            
	reserved "token_name", "token_symbol";
  string total_supply = 4;
  bool can_mint = 5;
	reserved 6;                               
	reserved "decimals";
  bool can_freeze = 7;
  bool can_burn = 8;
	reserved 9, 10, 11;                                                              
	reserved "type", "description", "icon_url";
	reserved 20, 21, 22, 23, 24, 25, 26;                                        
	reserved "native_chain", "sign_algo", "native_contract", "native_symbol", "native_decimals", "vault_id", "vault_pubkey";
}

                                                                   
message MintTokenTx {
  BaseMessage base = 1;
  string token_addr = 2;                
  string amount = 3;                                      
  string to = 4;                                           
}

                                                                                                
message BurnTokenTx {
  BaseMessage base = 1;
  string token_addr = 2;
  string amount = 3;
}

                                                                                                   
message TransferOwnershipTx {
  BaseMessage base = 1;
  string token_addr = 2;
  string new_owner = 3;
}

message FreezeTx {                           
  BaseMessage base = 1;
  string token_addr = 2;
  string target_addr = 3;
  bool freeze = 4;                                    
}

message Transaction {            
  BaseMessage base = 1;
  string to = 2;
  string token_address = 3;
  string amount = 4;
}

                     
enum OrderSide {
  BUY = 0;           
  SELL = 1;          
}

                                            
                                                                               
message OrderTx {
  BaseMessage base = 1;
  string base_token = 2;                                                                                
  string quote_token = 3;                                
  OrderOp op = 4;                                           
  string op_target_id = 5;                                    
  string amount = 6;                                         
  string price = 7;                                       
  OrderSide side = 8;                                              
                                                                      
                                                             
  reserved 9, 10, 11;
  bool is_market = 12;                                                            
                                                                                                         
                                                     
                                                      
                                                                                                        
                                             
  uint32 max_slippage_bps = 13;
}

                                      
                                                                                 
                                                                         
message OrderState {
  string order_id = 1;                                                
  string filled_base = 2;                                   
  string filled_quote = 3;                                   
  bool is_filled = 4;                                 
  OrderStateStatus status = 5;                  
  uint64 create_height = 6;                     
  uint64 last_update_height = 7;                      
                                                             
  string base_token = 8;                        
  string quote_token = 9;                        
  string amount = 10;                             
  string price = 11;                              
  OrderSide side = 12;                            
  string owner = 13;                                       
}

                     
enum OrderStateStatus {
  ORDER_OPEN = 0;                               
  ORDER_FILLED = 1;                   
  ORDER_CANCELLED = 2;             
}

                                 
                                                                          
enum FutureOrderStatus {
  FUTURE_ORDER_UNSPECIFIED = 0;
  FUTURE_ORDER_OPEN = 1;                                                 
  FUTURE_ORDER_FILLED = 2;                    
  FUTURE_ORDER_CANCELLED = 3;                                                        
  FUTURE_ORDER_CLOSED = 4;                          
  FUTURE_ORDER_LIQUIDATED = 5;                
}

message MinerTx {                                              
  BaseMessage base = 1;
  OrderOp op = 2;                                                             
  string amount = 3;                                             
                                                                                            
                                                                                       
                                                                                              
  string miner_address = 4;
  string reward_address = 5;                                                               
                                                                                          
                                                                                                   
  bytes bls_public_key = 6;
  bytes bls_proof = 7;
  string endpoint = 8;                                                  
}

                                                                                                  
                                                                                  
message MinerExitRecord {
  string miner_address = 1;
  uint64 exit_height = 2;
  string reward_address = 3;
}

                                                                                                    
                                                                                     
message MinerInfoTx {
  BaseMessage base = 1;
  string endpoint = 2;
}

                                                                            
message CertSignTx {
  BaseMessage base = 1;
  uint64 checkpoint_height = 2;                                
  uint32 signer_index = 3;                                              
  bytes  bls_signature = 4;                                        
  bytes  checkpoint_digest = 5;                                             
}

                                                                            
message CheckpointCertificate {
  uint64 height = 1;                                             
  bytes  block_hash = 2;                                                
  bytes  state_root = 3;                                                
  repeated CertMinerDiffEntry diffs = 4;                                                                     
  bytes  bitmap = 5;                                           
  bytes  agg_sig = 6;                                           
  uint64 prev_checkpoint = 7;                                              
  uint32 miner_count = 8;                                                                         
  int32  signer_count = 9;                                        
  uint64 chain_id = 10;                                                             
  uint32 committee_version = 11;                                                        
  uint32 committee_size = 12;                                                                       
  bytes  next_validator_set_root = 13;                                                           
}

                                       
message CertMinerDiffEntry {
  uint32 index = 1;                      
  bool   joined = 2;                                           
  string address = 3;                                                   
  bytes  pub_key = 4;                                             
  reserved 5;
  reserved "stake_owner";
  uint64 effective_weight = 6;                                          
}

                                                 
message CertMinerSnapshot {
  uint32 index = 1;
  string address = 2;
  bytes  pub_key = 3;
  reserved 4;
  reserved "stake_owner";
  uint64 effective_weight = 5;
}

                                        
message CertMinerSnapshotList {
  repeated CertMinerSnapshot miners = 1;
}

                                  
message CertGlobalState {
  uint64 last_checkpoint = 1;
  uint64 last_assembled_cert = 2;
}

                            
message AnyTx {
  oneof content {
    IssueTokenTx issue_token_tx = 1;
    FreezeTx freeze_tx = 2;
    Transaction transaction = 3;
    OrderTx order_tx = 4;
    MinerTx miner_tx = 6;
                           
    WitnessStakeTx witness_stake_tx = 7;                                           
    WitnessRequestTx witness_request_tx = 8;                                
    WitnessVoteTx witness_vote_tx = 9;                                
    WitnessChallengeTx witness_challenge_tx = 10;               
    ArbitrationVoteTx arbitration_vote_tx = 11;                       
    WitnessClaimRewardTx witness_claim_reward_tx = 12;                
                         
    FrostWithdrawRequestTx frost_withdraw_request_tx = 13;                      
    FrostWithdrawSignedTx frost_withdraw_signed_tx = 14;                              
    FrostWithdrawClaimTx frost_withdraw_claim_tx = 22;                                   
    FrostWithdrawCancelTx frost_withdraw_cancel_tx = 23;                                             
                                   
    FrostVaultDkgCommitTx frost_vault_dkg_commit_tx = 15;                       
    FrostVaultDkgShareTx frost_vault_dkg_share_tx = 16;                             
    FrostVaultDkgComplaintTx frost_vault_dkg_complaint_tx = 17;              
    FrostVaultDkgRevealTx frost_vault_dkg_reveal_tx = 18;                    
    FrostVaultDkgValidationSignedTx frost_vault_dkg_validation_signed_tx =
        19;                    
    FrostVaultTransitionSignedTx frost_vault_transition_signed_tx =
        20;                      
                                                                                                   
                               
    FutureOrderTx future_order_tx = 30;                                     
    FutureAddMarginTx future_add_margin_tx = 31;                         
    FutureRemoveMarginTx future_remove_margin_tx = 32;                   
                         
    MintTokenTx mint_token_tx = 33;                          
    BurnTokenTx burn_token_tx = 34;                          
    TransferOwnershipTx transfer_ownership_tx = 35;                   
                                    
    CertSignTx cert_sign_tx = 40;                           
                   
    SetReferrerTx set_referrer_tx = 41;                   
                         
    FutureOrderCancelTx future_order_cancel_tx = 42;                               
                         
    MinerInfoTx miner_info_tx = 43;                                                  
                                                                
    WitnessClaimStakeTx witness_claim_stake_tx = 44;
  }
}
                                                                    
enum OrderOp {
  ADD = 0;
  REMOVE = 1;
}

enum Status {
  PENDING = 0;
  FAILED = 1;
  SUCCEED = 2;
}

                                                                      
message NodeInfo {
  PublicKeys public_keys = 1;                                              
  string ip = 2;
  bool is_online = 3;
}

message NodeList { repeated NodeInfo nodes = 1; }

message ClientInfo {
  string ip = 1;
  bool authed = 2;
  PublicKeys public_keys = 3;                                                 
}

                                                                       
message HandshakeRequest {
  string client_id = 1;                            
  PublicKeys public_keys = 2;                                        
  bytes signature = 3;                 
}

message HandshakeResponse {
  string status = 1;                            
}

message StatusRequest {
  string address = 1;                   
}

message StatusResponse {
  string status = 1;        
  string info = 2;                         
  bool is_miner = 3; 
  int32 liveness_state = 4;
}

                                                                     
message MinerIPEntry {
  string address = 1;
  string ip = 2;
  uint64 index = 3;
}

message GetMinerIPMapRequest {
  uint64 min_height = 1;
}

message GetMinerIPMapResponse {
  uint64 height = 1;
  repeated MinerIPEntry entries = 2;
  string error = 3;
}

                                                                    

                                 
message GetData {
  string tx_id = 1;
  string address = 2;                   
}

message GetBlockRequest {
  uint64 height = 1;                                     
                                                                           
                                                                              
                                       
  bool include_read_model = 2;
}

enum ReadModelMutationOp {
  READ_MODEL_MUTATION_PUT = 0;
  READ_MODEL_MUTATION_DELETE = 1;
}

enum ReadModelRetention {
                                                                              
                                                                               
  READ_MODEL_RETENTION_BLOCK_SCOPED = 0;
                                                                             
                                                                              
  READ_MODEL_RETENTION_CURRENT = 1;
}

message ReadModelMutation {
  uint32 ordinal = 1;
  string key = 2;
  bytes value = 3;
  ReadModelMutationOp op = 4;
  ReadModelRetention retention = 5;
}

                                                                             
                                                                           
                                                                        
message BlockReadModel {
  uint32 schema_version = 1;
  uint64 height = 2;
  string block_id = 3;
  string parent_id = 4;
  bytes payload_hash = 5;
  repeated ReadModelMutation mutations = 6;
}

message GetBlockResponse {
  Block block = 1;                                      
  string error = 2;                                                 
  BlockReadModel read_model = 3;                                     
}

message BatchGetShortTxRequest {
  repeated bytes short_hashes = 1;                              
  string address = 2;                                
}

message BatchGetShortTxResponse { repeated AnyTx transactions = 1; }
                                                            
message GetConsensusStateRequest {}
                                                       
message PushQuery {
  reserved 3;
  reserved "deadline";
  uint32 request_id = 1;
  string address = 2;
  bool container_is_block = 4;                                                       
  bytes container =
      5;                                                                                                       
                                        
                                           
  uint64 requested_height = 6;
  string block_id = 7;
                                                                            
  bytes signature = 8;
                                                                             
                                                                         
  bytes nonce = 9;
                              
  bytes vrf_seed =
      10;                                                                           
  uint32 seq_id = 11;                                                    
  string responder = 12;                                                
  uint64 chain_id = 13;                                       
}

                                                                            
  
                                                                  
message PullQuery {
  reserved 3;
  reserved "deadline";
  uint32 request_id = 1;
  string address = 2;
                                
  string block_id = 4;
                                           
  uint64 requested_height = 5;
                              
  bytes vrf_seed = 6;                           
  uint32 seq_id = 7;                          
  string responder = 8;                                                
  uint64 chain_id = 9;                                       
  bytes signature = 10;                                                 
  bytes nonce = 11;                                                              
}

                                                                         
                     
message Chits {
  uint32 request_id = 1;
  string address = 2;
                                        
  string preferred_block = 3;
                                  
  string accepted_block = 4;
                                                                
  uint64 preferred_block_at_height = 5;
                                 
  uint64 accepted_height = 6;
  bytes bitmap = 7;                                              
                                                                            
                                                                              
  bytes chit_signature = 8;
  reserved 9 to 13;
  string requester = 14;                                              
  uint64 chain_id = 15;                                      
  bytes query_nonce = 16;                                                     
}

message HeightResponse {                           
  uint64 LastAcceptedHeight = 1;
  uint64 CurrentHeight = 2;
  string address = 3;                                
  uint32 pending_blocks_count = 4;                                     
  uint32 pending_tx_count = 5;                                       
                       
  bool is_syncing = 6;                                      
  uint64 sync_target_height = 7;                                                          
  bool is_snapshot_sync = 8;                                
}

                                                                             
                                                                            
enum AcceptedFrontierStatus {
  ACCEPTED_FRONTIER_STATUS_UNSPECIFIED = 0;
  ACCEPTED_FRONTIER_STATUS_OK = 1;
  ACCEPTED_FRONTIER_STATUS_BELOW_TARGET = 2;
  ACCEPTED_FRONTIER_STATUS_ANCHOR_MISMATCH = 3;
  ACCEPTED_FRONTIER_STATUS_UNAVAILABLE = 4;
}

message AcceptedFrontierRequest {
  reserved 5;
  reserved "deadline";

  uint32 version = 1;
  uint64 chain_id = 2;
  string requester_id = 3;
  bytes nonce = 4;
  uint64 anchor_height = 6;
  string anchor_block_id = 7;
  uint64 target_height = 8;
  bytes signature = 9;
                                                                                                 
                                                                                    
  bytes requester_secp_public_key = 10;
}

message AcceptedFrontierResponse {
  uint32 version = 1;
  uint64 chain_id = 2;
  bytes request_digest = 3;
  string responder_id = 4;
  AcceptedFrontierStatus status = 5;
  uint64 accepted_height = 6;
  string observed_anchor_id = 7;
  uint64 target_height = 8;
  string target_block_id = 9;
  bytes signature = 10;
}

message GetBlockByIDRequest { string block_id = 1; }

                                    
message PendingBlockInfo {
  string block_id = 1;              
  uint64 height = 2;                    
  string parent_id = 3;                
  string proposer = 4;               
  int32 window = 5;                     
  int32 votes = 6;                               
  bool is_preferred = 7;                               
}

                     
message HeightConsensusState {
  uint64 height = 1;              
  string preference = 2;                  
  int32 confidence = 3;                    
  bool finalized = 4;                         
}

                           
message PendingBlocksResponse {
  repeated PendingBlockInfo blocks = 1;
  repeated HeightConsensusState height_states = 2;                            
}

                                                                      

                        
enum WitnessStatus {
  WITNESS_CANDIDATE = 0;                            
  WITNESS_ACTIVE = 1;                            
  WITNESS_UNSTAKING = 2;                               
  WITNESS_EXITED = 3;                
  WITNESS_SLASHED = 4;                  
}

                     
enum WitnessVoteType {
  VOTE_PASS = 0;                                     
  VOTE_FAIL = 1;                                     
  VOTE_ABSTAIN = 2;                            
}

                     
enum RechargeRequestStatus {
  RECHARGE_PENDING = 0;                      
  RECHARGE_VOTING = 1;                       
  RECHARGE_CONSENSUS_PASS = 2;                  
  RECHARGE_CONSENSUS_FAIL = 3;                  
  RECHARGE_CHALLENGE_PERIOD = 4;             
  RECHARGE_CHALLENGED = 5;                   
  RECHARGE_ARBITRATION = 6;                  
  RECHARGE_FINALIZED = 7;                                
  RECHARGE_REJECTED = 8;                     
  RECHARGE_SHELVED = 9;                                        
  RECHARGE_PENDING_SELECTION = 10;                                                                     
}

                  
message WitnessInfo {
  string address = 1;                                          
  string stake_amount = 2;                                  
  string pending_reward = 3;                                   
  WitnessStatus status = 4;                           
  uint64 unstake_height = 5;                                                                    
  uint64 total_witness_count = 6;                              
  uint64 pass_count = 7;                                    
  uint64 fail_count = 8;                                    
  uint64 abstain_count = 9;                                 
  uint64 slashed_count = 10;                                   
  repeated string pending_tasks = 11;                                           
  repeated string shelved_arbitrations = 12;                           
  string total_reward = 13;                                          
  string reserved_stake_amount = 14;                                                               
  uint64 active_case_count = 15;                                                                                  
}

message WitnessCaseCollateral {
  string address = 1;
  uint32 role_mask = 2;                                         
  string committed_amount = 3;                                                       
  string reserved_amount = 4;
  string slashed_amount = 5;
  bool slash_applied = 6;
  bool released = 7;
  string original_amount = 8;                                                             
}

                                  
message WitnessStakeTx {
  BaseMessage base = 1;
  OrderOp op = 2;                                   
  string amount = 3;                          
}

                                       
message WitnessRequestTx {
  BaseMessage base = 1;
  string native_chain = 2;                                             
  string native_tx_hash = 3;                           
	reserved 4;                                                                              
	reserved "token_address";
  string amount = 5;                          
  string receiver_address = 6;                            
  string memo = 7;                                                             
  string recharge_fee = 8;                                                                             
  uint32 native_vout = 9;                                           
  bytes native_script = 10;                                                                    
                                                                                            
  string native_contract = 11;                                              
	reserved 12, 13;                                                  
	reserved "native_symbol", "native_decimals";
  uint32 vault_id = 14;                                                                           
  uint32 deposit_event_index = 15;                                                                          
  uint32 deposit_protocol = 16;                                                 
}

                  
message WitnessVote {
  string request_id = 1;                          
  string witness_address = 2;                      
  WitnessVoteType vote_type = 3;                
  string reason = 4;                                               
  uint64 timestamp = 5;                            
  string tx_id = 6;                                
  uint32 round = 7;                                                             
  uint64 ballot_round = 8;                                                                
                                                                                                           
}

                                       
message WitnessVoteTx {
  BaseMessage base = 1;
  WitnessVote vote = 2;
}

                     
                                                                                    
message RechargeRequest {
  string request_id = 1;                                                             
  string native_chain = 2;                                   
  string native_tx_hash = 3;                                       
  string token_address = 4;                              
  string amount = 5;                                      
  string receiver_address = 6;                            
  string requester_address = 7;                              
  RechargeRequestStatus status = 8;                       
  uint64 create_height = 9;                               
  uint64 deadline_height = 10;                            
  uint64 finalize_height = 11;                            
  uint32 round = 12;                                                                 
  repeated string selected_witnesses = 13;                                  
  repeated WitnessVote votes = 14;                           
  uint32 pass_count = 15;                                 
  uint32 fail_count = 16;                                 
  uint32 abstain_count = 17;                           
  string challenge_id = 18;                                                
  string recharge_fee = 19;                                                 
  uint32 vault_id =
      20;                                                                                   
  uint32 native_vout = 21;                                   
  bytes native_script = 22;                                  
                                                                                       
  string native_contract = 23;                                              
	reserved 24, 25;                                                  
	reserved "native_symbol", "native_decimals";
  uint64 shelve_height = 26;                                                                  
  uint64 selection_height = 27;                                                                                               
  bytes selection_beacon = 28;                                                
  uint64 decision_height = 29;                                                     
  uint64 vote_accept_until_height = 30;                                                                
  uint32 deposit_event_index = 31;
  uint32 deposit_protocol = 32;
  repeated WitnessCaseCollateral case_collateral = 33;
  string fee_escrow = 34;                                                             
  bool fee_settled = 35;
  uint32 arbitration_protocol_version = 36;
  repeated WitnessVote original_positions = 37;                                                 
  string requester_bond_amount = 38;                                                                                   
  RequesterBondStatus requester_bond_status = 39;
  uint32 economics_policy = 40;                                                             
  string receiver_net_amount = 41;                                                     
  string requester_reward_amount = 42;                                                    
  string witness_reward_amount = 43;                                                                  
  string gross_amount = 44;                                                            
  uint32 btc_protocol_version = 45;                                                                  
}

                                                                           
                                                                            
message RechargeRewardAttribution {
  string request_id = 1;
  string token_address = 2;
  string receiver_net_amount = 3;
  string requester_reward_amount = 4;
  string witness_reward_amount = 5;
  uint64 finalize_height = 6;
}

               
message WitnessChallengeTx {
  BaseMessage base = 1;
  string request_id = 2;                                
  string stake_amount = 3;                                   
  string reason = 4;                      
  string evidence = 5;                                            
}

                      
enum ChallengeStatus {
  CHALLENGE_ACTIVE = 0;                      
  CHALLENGE_FINALIZED = 1;             
  CHALLENGE_PENDING_SELECTION = 2;                                                   
