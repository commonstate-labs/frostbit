name: dex-local20

                                                                        
                                                                    
                                                                           
                                                                            
configs:
  local20-config:
    file: ../config/env/local20/config.json
  local20-genesis:
    file: ../config/env/local20/genesis.json
  local20-frost:
    file: ../config/env/local20/frost_default.json
  local20-witness:
    file: ../config/env/local20/witness_default.json
  local20-peers:
    file: ../config/env/local20/peers.json

x-node-common: &node-common
  build:
    context: ..
    dockerfile: Dockerfile
    args:
      BUILD_TAG: local20
  image: dex-local20-node:latest
  init: true
  environment:
    DEX_ENV: local20
    DEX_EXPLORER_SERVICE_TOKEN: ${DEX_EXPLORER_SERVICE_TOKEN:?set a shared 32..512 character Explorer service token}
    GOMAXPROCS: "1"
    GOMEMLIMIT: 640MiB
  configs:
    - source: local20-config
      target: /app/config/env/local20/config.json
      mode: 0444
    - source: local20-genesis
      target: /app/config/env/local20/genesis.json
      mode: 0444
    - source: local20-frost
      target: /app/config/env/local20/frost_default.json
      mode: 0444
    - source: local20-witness
      target: /app/config/env/local20/witness_default.json
      mode: 0444
    - source: local20-peers
      target: /app/config/env/local20/peers.json
      mode: 0444
  cpus: "1.0"
  mem_limit: 768m
  memswap_limit: 768m
  storage_opt:
    size: "20G"
  stop_grace_period: 30s

services:
  node00:
    <<: *node-common
    container_name: dex-local20-node00
    hostname: node00
    command: ["--config-dir=/app/config/env/local20", "--peers=/app/config/env/local20/peers.json", "--expected-address=${DEX_MINER_ADDRESS_00:?set DEX_MINER_ADDRESS_00}", "--data-dir=/data/${DEX_MINER_ADDRESS_00:?set DEX_MINER_ADDRESS_00}", "--resume=true", "--advertise-addr=198.18.0.11:6000", "--no-simulator"]
    ports: ["6000:6000/tcp", "6000:6000/udp"]
    volumes:
      - type: bind
        source: ${DEX_NODE_SECRET_ROOT:?set DEX_NODE_SECRET_ROOT}/${DEX_MINER_ADDRESS_00:?set DEX_MINER_ADDRESS_00}
        target: /run/secrets/dex-miner
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DEX_NODE_DATA_ROOT:?set DEX_NODE_DATA_ROOT}/${DEX_MINER_ADDRESS_00:?set DEX_MINER_ADDRESS_00}
        target: /data/${DEX_MINER_ADDRESS_00:?set DEX_MINER_ADDRESS_00}
        bind: { create_host_path: false }
    networks:
      dexnet:
        ipv4_address: 198.18.0.11

  node01:
    <<: *node-common
